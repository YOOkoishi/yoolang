name: Functional Tests and Perf

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  functional-and-perf:
    runs-on: [self-hosted, linux, x64, yoolang]
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout with SSH/HTTPS fallback
        timeout-minutes: 10
        env:
          CI_GITHUB_SSH_KEY: ${{ secrets.CI_GITHUB_SSH_KEY }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$CI_GITHUB_SSH_KEY" > ~/.ssh/ci_github_key
          chmod 600 ~/.ssh/ci_github_key

          github_known_hosts="$HOME/.ssh/github_known_hosts"
          ssh_ready=false
          if timeout --kill-after=5s 20s ssh-keyscan -T 15 -p 443 ssh.github.com \
            > "$github_known_hosts"; then
            ssh_ready=true
          else
            echo "SSH host-key lookup failed; checkout will start with HTTPS"
            : > "$github_known_hosts"
          fi
          chmod 644 "$github_known_hosts"

          git init .
          git remote set-url origin ssh://git@ssh.github.com:443/YOOkoishi/yoolang.git \
            2>/dev/null || git remote add origin ssh://git@ssh.github.com:443/YOOkoishi/yoolang.git

          # A cancelled self-hosted run can leave fetch locks in the persistent workspace.
          rm -f .git/index.lock .git/shallow.lock .git/FETCH_HEAD.lock

          export GIT_SSH_COMMAND="ssh \
            -i $HOME/.ssh/ci_github_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$github_known_hosts \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3"
          export GIT_TERMINAL_PROMPT=0

          https_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"

          fetched=false
          for attempt in 1 2 3; do
            if [ "$ssh_ready" = true ]; then
              echo "Fetching $GITHUB_SHA over SSH (attempt $attempt/3)"
              if timeout --kill-after=10s 60s git -c protocol.version=2 fetch \
                --no-tags --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"; then
                fetched=true
                break
              fi
              echo "SSH fetch failed or timed out; trying HTTPS"
            else
              echo "Trying HTTPS fetch (attempt $attempt/3)"
            fi

            if timeout --kill-after=10s 60s git \
              -c protocol.version=2 \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $https_auth" \
              fetch --no-tags --no-recurse-submodules --depth=1 \
              https://github.com/YOOkoishi/yoolang.git "$GITHUB_SHA"; then
              fetched=true
              break
            fi

            echo "HTTPS fetch attempt $attempt failed or timed out"
            sleep $((attempt * 10))
          done

          if [ "$fetched" != true ]; then
            echo "Git fetch unavailable; downloading the current commit archive"
            archive="$RUNNER_TEMP/yoolang-$GITHUB_SHA.tar.gz"
            rm -f "$archive"
            curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --retry-max-time 150 \
              --connect-timeout 15 --max-time 120 \
              --header "Authorization: Bearer $CHECKOUT_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --output "$archive" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA"
            tar -tzf "$archive" >/dev/null

            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            tar -xzf "$archive" --strip-components=1
            echo "Checked out $GITHUB_SHA from GitHub archive fallback"
          else
            git checkout --force --detach FETCH_HEAD
          fi

      - name: Clean CI outputs
        run: |
          rm -rf build/perf-ci build/github-actions ci-result public

      - name: Ensure xmake in PATH
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already available: $(xmake --version | head -n 1)"
            exit 0
          fi
          if [ -f "$HOME/.local/bin/xmake" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/xmake" --version
            exit 0
          fi
          echo "xmake not found after setup_env.sh"
          exit 1

      - name: Check runner dependencies
        run: |
          command -v python3
          command -v cmake
          command -v clang++
          command -v qemu-riscv64
          command -v riscv64-linux-gnu-gcc
          command -v riscv64-linux-gnu-g++
          test -f runtime/libsysy_riscv.a

      - name: Build (xmake release)
        run: |
          xmake f -m release
          xmake -vD

      - name: Run functional tests
        id: functional_tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/github-actions
          python3 scripts/run_tests.py --suite stage --suite e2e --test-root test/functional --runtime runtime/libsysy_riscv.a --o1 --compile-timeout 60 2>&1 | tee build/github-actions/functional-tests.log

      - name: Run performance tests
        id: perf_tests
        if: always()
        continue-on-error: true
        env:
          PERF_TEST_DIRS: test/performance,test/bsb-final
          PERF_EXCLUDE_CASES: |
            test/performance/h-10-02.sy
            test/performance/h-10-03.sy
            test/bsb-final/2025-CPS-39.sy
            test/bsb-final/2025-Z8N-28.sy
          PERF_TIMEOUT_SEC: "20"
          SYSY_RUNTIME_LIB: runtime/libsysy_riscv.a
          ENABLE_QEMU_INSN_COUNT: "1"
          QEMU_RISCV64: /home/cjj/.local/yoolang-ci/qemu-plugin/bin/qemu-riscv64
          QEMU_INSN_TIMEOUT: "30"
          QEMU_INSN_STRICT: "0"
        run: |
          set -o pipefail
          mkdir -p build/github-actions
          python3 scripts/compare_perf.py 2>&1 | tee build/github-actions/perf-tests.log

      - name: Compare perf against local main baseline
        if: always()
        continue-on-error: true
        env:
          BASELINE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          mkdir -p build/perf-ci
          baseline_dir="$HOME/.cache/yoolang-ci/baselines/main"
          baseline_json="$baseline_dir/perf-report.json"
          baseline_meta="$baseline_dir/meta.json"

          current_json="build/perf-ci/perf-report.json"
          delta_md="build/perf-ci/perf-delta.md"
          delta_json="build/perf-ci/perf-delta.json"
          insn_delta_json="build/perf-ci/instruction-count-compare.json"

          baseline_label="local ${BASELINE_BRANCH} baseline"
          baseline_commit_sha=""
          baseline_commit_time=""
          baseline_commit_title=""
          baseline_commit_author=""

          if [ -f "$baseline_meta" ]; then
            baseline_commit_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path.home() / ".cache/yoolang-ci/baselines/main/meta.json"
          try:
              print(json.loads(p.read_text()).get("sha", ""))
          except Exception:
              print("")
          PY
          )"
            baseline_commit_time="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path.home() / ".cache/yoolang-ci/baselines/main/meta.json"
          try:
              print(json.loads(p.read_text()).get("timestamp", ""))
          except Exception:
              print("")
          PY
          )"
            baseline_commit_title="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path.home() / ".cache/yoolang-ci/baselines/main/meta.json"
          try:
              print(json.loads(p.read_text()).get("title", ""))
          except Exception:
              print("")
          PY
          )"
            baseline_commit_author="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path.home() / ".cache/yoolang-ci/baselines/main/meta.json"
          try:
              print(json.loads(p.read_text()).get("author", ""))
          except Exception:
              print("")
          PY
          )"
          fi

          if [ ! -f "$current_json" ]; then
            {
              echo "## Perf Change vs main baseline"
              echo
              echo "- Status: NO BASELINE"
              echo "- Baseline: ${baseline_label}"
              echo "- Reason: current perf report unavailable"
            } > "$delta_md"
            printf '{"status":"NO BASELINE","baseline":"%s","reason":"current perf report unavailable"}\n' "$baseline_label" > "$delta_json"
            printf '{"status":"NO BASELINE","baseline":"%s","reason":"current perf report unavailable","current_total_instructions":null,"baseline_total_instructions":null,"rows":[]}\n' "$baseline_label" > "$insn_delta_json"
            exit 0
          fi

          if [ ! -f "$baseline_json" ]; then
            {
              echo "## Perf Change vs main baseline"
              echo
              echo "- Status: NO BASELINE"
              echo "- Baseline: ${baseline_label}"
              echo "- Reason: local main baseline not found yet"
              echo
              echo "Run CI successfully on main once to create:"
              echo
              echo "\`$baseline_json\`"
            } > "$delta_md"
            printf '{"status":"NO BASELINE","baseline":"%s","reason":"local main baseline not found yet"}\n' "$baseline_label" > "$delta_json"
            printf '{"status":"NO BASELINE","baseline":"%s","reason":"local main baseline not found yet","current_total_instructions":null,"baseline_total_instructions":null,"rows":[]}\n' "$baseline_label" > "$insn_delta_json"
            exit 0
          fi

          python3 scripts/compare_perf_baseline.py \
            --current "$current_json" \
            --baseline "$baseline_json" \
            --out-md "$delta_md" \
            --out-json "$delta_json" \
            --out-insn-json "$insn_delta_json" \
            --baseline-label "$baseline_label" \
            --baseline-branch "$BASELINE_BRANCH" \
            --baseline-run-id "" \
            --baseline-run-url "" \
            --baseline-commit-sha "$baseline_commit_sha" \
            --baseline-commit-time "$baseline_commit_time" \
            --baseline-commit-title "$baseline_commit_title" \
            --baseline-commit-author "$baseline_commit_author" || true

      - name: Configure GitHub Pages
        if: always()
        continue-on-error: true
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Generate instruction count report page
        if: always()
        continue-on-error: true
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PAGES_BASE_URL: ${{ steps.configure_pages.outputs.base_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pages_history_dir="$HOME/.cache/yoolang-ci/pages-history"
          if [ -d "$pages_history_dir" ]; then
            mkdir -p public
            cp -a "$pages_history_dir/." public/
          fi

          is_main="false"
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            is_main="true"
          fi

          # Merge remote history to reduce staleness across runners
          if [ "$is_main" != "true" ] && [ -n "${PAGES_BASE_URL:-}" ]; then
            curl -sSf "${PAGES_BASE_URL}/report-history.json" -o /tmp/remote-history.json 2>/dev/null || true
            curl -sSf "${PAGES_BASE_URL}/report-index.json" -o /tmp/remote-report-index.json 2>/dev/null || true
            if [ -f /tmp/remote-history.json ]; then
              if [ -f /tmp/remote-report-index.json ]; then
                python3 scripts/merge_report_history.py public /tmp/remote-history.json /tmp/remote-report-index.json || true
              else
                python3 scripts/merge_report_history.py public /tmp/remote-history.json || true
              fi
              rm -f /tmp/remote-history.json /tmp/remote-report-index.json
            fi
          fi

          safe_branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')

          if [ "$is_main" = "true" ]; then
            perf_html="public/perf-report/index.html"
            insn_html="public/instruction-report/index.html"
            perf_runs="public/perf-report/runs"
            insn_runs="public/instruction-report/runs"
            is_main_flag="--is-main-branch"
          else
            branch_dir="public/branches/${safe_branch}"
            perf_html="${branch_dir}/perf-report/index.html"
            insn_html="${branch_dir}/instruction-report/index.html"
            perf_runs="${branch_dir}/perf-report/runs"
            insn_runs="${branch_dir}/instruction-report/runs"
            is_main_flag=""
          fi

          python3 scripts/generate_instruction_report.py \
            --perf-report build/perf-ci/perf-report.json \
            --out-json ci-result/instruction_count_compare.json \
            --out-html "$insn_html" \
            --pages-base-url "${PAGES_BASE_URL:-}"

          python3 scripts/generate_perf_report.py \
            --perf-report build/perf-ci/perf-report.json \
            --delta-report build/perf-ci/perf-delta.json \
            --out-json ci-result/perf_compare.json \
            --out-html "$perf_html" \
            --pages-base-url "${PAGES_BASE_URL:-}"

          run_id="${GITHUB_RUN_ID:-local}"
          mkdir -p "$insn_runs/$run_id" "$perf_runs/$run_id"
          cp "$insn_html" "$insn_runs/$run_id/index.html"
          cp ci-result/instruction_count_compare.json "$insn_runs/$run_id/instruction_count_compare.json"
          cp "$perf_html" "$perf_runs/$run_id/index.html"
          cp ci-result/perf_compare.json "$perf_runs/$run_id/perf_compare.json"
          cp build/perf-ci/perf-report.json "$perf_runs/$run_id/perf-report.json"

          python3 scripts/update_report_history.py \
            --public-dir public \
            --run-id "$run_id" \
            --run-number "${GITHUB_RUN_NUMBER:-}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --perf-report build/perf-ci/perf-report.json \
            --pages-base-url "${PAGES_BASE_URL:-}" \
            --branch "${GITHUB_REF_NAME}" \
            $is_main_flag

          rm -rf "$pages_history_dir"
          mkdir -p "$pages_history_dir"
          cp -a public/. "$pages_history_dir/"

      - name: Save local main perf baseline
        if: always()
        continue-on-error: true
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set +e
          current_json="build/perf-ci/perf-report.json"
          baseline_dir="$HOME/.cache/yoolang-ci/baselines/main"

          if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Not on default branch; skip saving local main baseline."
            exit 0
          fi

          if [ "${{ steps.perf_tests.outcome }}" != "success" ]; then
            echo "Perf step outcome is not success; skip saving local main baseline."
            exit 0
          fi

          if [ ! -f "$current_json" ]; then
            echo "Current perf report not found; skip saving local main baseline."
            exit 0
          fi

          mkdir -p "$baseline_dir"
          cp "$current_json" "$baseline_dir/perf-report.json"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          baseline_dir = Path.home() / ".cache/yoolang-ci/baselines/main"
          baseline_dir.mkdir(parents=True, exist_ok=True)

          timestamp = os.environ.get("GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP", "")
          if not timestamp:
              try:
                  timestamp = subprocess.check_output(
                      ["git", "show", "-s", "--format=%cI", "HEAD"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except Exception:
                  timestamp = ""

          meta = {
              "sha": os.environ.get("GITHUB_SHA", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "timestamp": timestamp,
              "title": (os.environ.get("HEAD_COMMIT_MESSAGE", "").splitlines() or [""])[0],
              "author": os.environ.get("GITHUB_ACTOR", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
          }

          (baseline_dir / "meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n"
          )
          PY

          echo "Saved local main baseline to $baseline_dir/perf-report.json"

      - name: Write summary
        if: always()
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}
          PERF_OUTCOME: ${{ steps.perf_tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          functional_log = root / "build/github-actions/functional-tests.log"
          perf_log = root / "build/github-actions/perf-tests.log"
          perf_json = root / "build/perf-ci/perf-report.json"
          insn_delta_json = root / "build/perf-ci/instruction-count-compare.json"
          perf_delta_md = root / "build/perf-ci/perf-delta.md"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def parse_functional_summary(text: str):
              match = re.search(
                  r"summary:\s+(\d+) passed,\s+(\d+) failed,\s+(\d+) skipped,\s+(\d+) xfailed,\s+(\d+) xpassed",
                  text,
              )
              if not match:
                  return None
              return {
                  "passed": int(match.group(1)),
                  "failed": int(match.group(2)),
                  "skipped": int(match.group(3)),
                  "xfailed": int(match.group(4)),
                  "xpassed": int(match.group(5)),
              }

          def truncate_text(text: str, limit: int = 4000) -> str:
              if len(text) <= limit:
                  return text
              return text[:limit] + f"\n... <truncated, {len(text) - limit} chars omitted> ..."

          def md_escape(text: str) -> str:
              return text.replace("|", "\\|").replace("\n", "<br>")

          def format_speedup(value) -> str:
              return f"{value:.2f}x" if isinstance(value, (int, float)) else "N/A"

          def parse_failed_cases(text: str) -> list[dict[str, str]]:
              cases: list[dict[str, str]] = []
              current = None

              def flush_current() -> None:
                  nonlocal current
                  if current is None:
                      return
                  detail_lines = current.get("detail_lines", [])
                  detail = "\n".join(str(line) for line in detail_lines).strip()
                  cases.append({"case": str(current["case"]), "detail": detail})
                  current = None

              for line in text.splitlines():
                  match = re.match(r"^FAIL\s+\w+\s+(.+?)\s+\([0-9.]+s\)$", line)
                  if match:
                      flush_current()
                      current = {"case": match.group(1), "detail_lines": []}
                      continue
                  if re.match(r"^(PASS|FAIL|SKIP|XFAIL|XPASS)\s+", line) or line.startswith("summary:"):
                      flush_current()
                      continue
                  if current is not None:
                      if line.startswith("    "):
                          current["detail_lines"].append(line[4:])
                      elif line.strip():
                          current["detail_lines"].append(line)
              flush_current()
              return cases

          functional_text = functional_log.read_text(errors="replace") if functional_log.exists() else ""
          functional = parse_functional_summary(functional_text)
          functional_failed_cases = parse_failed_cases(functional_text)

          if functional is None:
              functional_status = "PASS" if os.environ["FUNCTIONAL_OUTCOME"] == "success" else "FAIL"
          else:
              functional_status = "PASS" if functional["failed"] == 0 else "FAIL"

          perf_payload = None
          if perf_json.exists():
              perf_payload = json.loads(perf_json.read_text())

          if perf_payload is None:
              perf_status = "PASS" if os.environ["PERF_OUTCOME"] == "success" else "FAIL"
          else:
              perf_status = str(perf_payload.get("status", os.environ["PERF_OUTCOME"].upper()))
          overall_status = "PASS" if functional_status == "PASS" and perf_status == "PASS" else "FAIL"

          lines = [
              "# 🧪 CI Summary",
              "",
              "## 📌 Overall",
              f"- Status: {'✅' if overall_status == 'PASS' else '❌'} {overall_status}",
              f"- Functional: {'✅' if functional_status == 'PASS' else '❌'} {functional_status}",
              f"- Perf: {'✅' if perf_status == 'PASS' else '❌'} {perf_status}",
              f"- Branch: `{os.environ.get('GITHUB_REF_NAME', 'unknown')}`",
              f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')[:12]}`",
              "",
              "## ✅ Functional Tests",
              "- Command: `scripts/run_tests.py --suite stage --suite e2e --test-root test/functional --runtime runtime/libsysy_riscv.a --o1 --compile-timeout 60`",
              f"- Status: {'✅' if functional_status == 'PASS' else '❌'} {functional_status}",
          ]

          if functional is None:
              lines.append(f"- Result: could not parse summary, step outcome was `{os.environ['FUNCTIONAL_OUTCOME']}`")
          else:
              lines.append(f"- Passed: {functional['passed']}")
              lines.append(f"- Failed: {'✅' if functional['failed'] == 0 else '❌'} {functional['failed']}")
              lines.append(f"- Skipped: {functional['skipped']}")
              lines.append(f"- XFailed: {functional['xfailed']}")
              lines.append(f"- XPassed: {functional['xpassed']}")

          if functional_failed_cases:
              lines.extend(
                  [
                      "",
                      "<details><summary>❌ Functional test failures</summary>",
                      "",
                  ]
              )
              for failure in functional_failed_cases[:20]:
                  lines.append(f"### `{failure['case']}`")
                  detail = failure.get("detail", "").strip()
                  if detail:
                      lines.extend(["", "```text", truncate_text(detail, 4000), "```", ""])
              if len(functional_failed_cases) > 20:
                  lines.append(f"- ... and {len(functional_failed_cases) - 20} more")
              lines.extend(["", "</details>"])

          lines.extend(["", "## 📊 Performance Tests"])

          if perf_payload is None:
              lines.append(f"- Status: {'✅' if os.environ['PERF_OUTCOME'] == 'success' else '❌'} {os.environ['PERF_OUTCOME'].upper()}")
              lines.append("- Result: perf report was not generated")
              if perf_log.exists():
                  tail = "\n".join(perf_log.read_text(errors="replace").splitlines()[-20:])
                  if tail:
                      lines.extend(["", "<details><summary>📄 Perf log tail</summary>", "", "```text", tail, "```", "", "</details>"])
          else:
              rows = perf_payload.get("rows", [])
              total_runtime = perf_payload.get("total_runtime_sec", 0.0)
              status_emoji = perf_payload.get("status_emoji", "✅" if perf_status == "PASS" else "❌")
              lines.append(f"- Status: {status_emoji} {perf_status}")
              lines.append(f"- Compiler opt: `{perf_payload.get('compiler_opt', '-O1')}`")
              lines.append(f"- Generated: {perf_payload.get('generated_utc', 'unknown')}")
              lines.append(f"- Cases: {perf_payload.get('cases', len(rows))}")
              perf_failures = perf_payload.get('failures', 'unknown')
              lines.append(f"- Failed: {'✅' if perf_failures == 0 else '❌'} {perf_failures}")
              lines.append(f"- Total runtime (s): {float(total_runtime):.4f}")
              insn_summary = perf_payload.get("instruction_count_summary", {})
              if isinstance(insn_summary, dict):
                  lines.append(f"- QEMU dynamic instruction count: {insn_summary.get('status', 'UNKNOWN')}")
              gcc_o3_geomean = perf_payload.get("gcc_o3_geomean")
              clang_o3_geomean = perf_payload.get("clang_o3_geomean")
              gcc_o3_faster_cases = perf_payload.get("gcc_o3_faster_cases")
              clang_o3_faster_cases = perf_payload.get("clang_o3_faster_cases")
              if isinstance(gcc_o3_geomean, (int, float)) or isinstance(clang_o3_geomean, (int, float)):
                  lines.append(
                      "- 🧮 Geomean speedup: "
                      f"GCC {format_speedup(gcc_o3_geomean)} / Clang++ {format_speedup(clang_o3_geomean)}"
                  )
                  lines.append(
                      "- 🏁 Beats GCC: "
                      f"{gcc_o3_faster_cases if isinstance(gcc_o3_faster_cases, int) else 'N/A'} / "
                      f"Clang++: {clang_o3_faster_cases if isinstance(clang_o3_faster_cases, int) else 'N/A'}"
                  )
              lines.extend(["", "| Case | GCC | Clang++ | Compiler | Status |", "| --- | --- | --- | --- | --- |"])

              display_rows = sorted(rows, key=lambda row: str(row.get("status", "")) == "OK")
              for row in display_rows:
                  detail = str(row.get("detail", "")).strip()
                  status_cell = str(row.get("status", ""))
                  if detail:
                      status_cell = f"{status_cell}\n\n{detail}"
                  status_cell = md_escape(truncate_text(status_cell, 4000))
                  lines.append(
                      "| "
                      + " | ".join(
                          [
                              md_escape(str(row.get("case", ""))),
                              md_escape(str(row.get("gcc", ""))),
                              md_escape(str(row.get("clang", ""))),
                              md_escape(str(row.get("compiler", row.get("yoolang", "")))),
                              status_cell,
                          ]
                      )
                      + " |"
                  )

          if perf_delta_md.exists():
              lines.extend(["", perf_delta_md.read_text(errors="replace").strip(), ""])
          elif insn_delta_json.exists():
              try:
                  insn_delta = json.loads(insn_delta_json.read_text(errors="replace"))
              except Exception:
                  insn_delta = {}
              if insn_delta:
                  lines.extend(["", "## 🧮 QEMU Dynamic Instruction Count", "", f"- Status: {insn_delta.get('status', 'UNKNOWN')}"])

          summary_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            build/github-actions/functional-tests.log
            build/github-actions/perf-tests.log
            build/perf-ci/perf-report.md
            build/perf-ci/perf-report.json
            build/perf-ci/perf-delta.md
            build/perf-ci/perf-delta.json
            build/perf-ci/instruction-count-compare.json
            ci-result/instruction_count_compare.json
            ci-result/perf_compare.json
            public/instruction-report/index.html
            public/instruction-report/instruction_count_compare.json
            public/instruction-report/history.html
            public/instruction-report/runs
            public/perf-report/index.html
            public/perf-report/perf_compare.json
            public/perf-report/history.html
            public/perf-report/runs
            public/index.html
            public/history.html
            public/report-history.json
            public/branches
          if-no-files-found: warn

      - name: Upload instruction report to Pages
        if: always()
        id: upload_instruction_pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy instruction report to Pages
        if: always()
        id: deploy_instruction_pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail job if functional tests failed
        if: always()
        env:
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          log_path = Path("build/github-actions/functional-tests.log")
          if log_path.exists():
              text = log_path.read_text(errors="replace")
              match = re.search(
                  r"summary:\s+\d+ passed,\s+(\d+) failed,\s+\d+ skipped,\s+\d+ xfailed,\s+\d+ xpassed",
                  text,
              )
              if match:
                  failed = int(match.group(1))
                  if failed > 0:
                      print(f"Functional tests failed: {failed}")
                      sys.exit(1)
                  print("Functional tests passed.")
                  sys.exit(0)

          if os.environ["FUNCTIONAL_OUTCOME"] != "success":
              print("Functional tests did not complete successfully.")
              sys.exit(1)
          print("Functional tests passed.")
          PY

      - name: Fail job if performance tests failed
        if: always()
        env:
          PERF_OUTCOME: ${{ steps.perf_tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          perf_outcome = os.environ.get("PERF_OUTCOME", "unknown")
          report_path = Path("build/perf-ci/perf-report.json")

          if perf_outcome != "success":
              print(f"Performance test step did not complete successfully: {perf_outcome}")
              sys.exit(1)

          if not report_path.exists():
              print(f"Performance report is missing: {report_path}")
              sys.exit(1)

          try:
              report = json.loads(report_path.read_text(errors="replace"))
          except Exception as exc:
              print(f"Performance report is not valid JSON: {exc}")
              sys.exit(1)

          status = str(report.get("status", "UNKNOWN"))
          failures = report.get("failures")
          if status != "PASS":
              print(f"Performance report status is {status}, expected PASS")
              sys.exit(1)
          if failures != 0:
              print(f"Performance report failures is {failures}, expected 0")
              sys.exit(1)

          insn_summary = report.get("instruction_count_summary", {})
          if isinstance(insn_summary, dict) and insn_summary.get("status") == "FAILED":
              print("QEMU dynamic instruction count failed")
              reason = insn_summary.get("reason")
              if reason:
                  print(f"Reason: {reason}")
              sys.exit(1)

          print("Performance tests passed.")
          PY

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HTTPS_PROXY: http://127.0.0.1:7890
          HTTP_PROXY: http://127.0.0.1:7890
          NO_PROXY: localhost,127.0.0.1,::1
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}
          PERF_OUTCOME: ${{ steps.perf_tests.outcome }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          PAGES_BASE_URL: ${{ steps.deploy_instruction_pages.outputs.page_url }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.deploy_instruction_pages.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not set; skipping Discord notification.")
              raise SystemExit(0)

          def read_json(path: str) -> dict:
              p = Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(errors="replace"))
              except Exception as exc:
                  print(f"failed to read {path}: {exc}")
                  return {}

          def parse_seconds(value):
              if isinstance(value, (int, float)):
                  return float(value)
              match = re.search(r"([0-9]+(?:\.[0-9]+)?)s?", str(value))
              return float(match.group(1)) if match else None

          def fmt_seconds(value):
              return "N/A" if value is None else f"{value:.2f}s"

          def fmt_speedup(reference_time, current_time):
              if reference_time is None or current_time is None or current_time <= 0:
                  return "N/A"
              return f"{reference_time / current_time:.2f}x"

          def fmt_status(value: str) -> str:
              return "✅ PASS" if value == "success" else "❌ FAIL"

          def fmt_overall(delta_pct) -> str:
              if not isinstance(delta_pct, (int, float)):
                  return "ℹ️ N/A"
              if delta_pct < 0:
                  return f"⚠️ 慢 {abs(delta_pct):.1f}%"
              if delta_pct > 0:
                  return f"🚀 快 {delta_pct:.1f}%"
              return "✅ 持平 0.0%"

          def fmt_baseline_speedup(delta: dict) -> str:
              speedup = delta.get("total_speedup")
              if isinstance(speedup, (int, float)):
                  return f"{speedup:.2f}x"
              baseline_total = delta.get("baseline_compiler_total")
              current_total = delta.get("current_compiler_total")
              if isinstance(baseline_total, (int, float)) and isinstance(current_total, (int, float)) and current_total > 0:
                  return f"{baseline_total / current_total:.2f}x"
              return "N/A"

          def fmt_insn(value) -> str:
              return f"{value:,}" if isinstance(value, int) else "N/A"

          def fmt_insn_overall(delta: dict) -> str:
              delta_pct = delta.get("total_delta_pct")
              if not isinstance(delta_pct, (int, float)):
                  return "ℹ️ N/A"
              if delta_pct > 0:
                  return f"⚠️ 多 {delta_pct:.1f}%"
              if delta_pct < 0:
                  return f"🚀 少 {abs(delta_pct):.1f}%"
              return "✅ 持平 0.0%"

          def fmt_insn_speedup(delta: dict) -> str:
              speedup = delta.get("total_speedup")
              return f"{speedup:.2f}x" if isinstance(speedup, (int, float)) else "N/A"

          def _branch_path() -> str:
              ref_name = os.environ.get("REF_NAME", "")
              default_branch = os.environ.get("DEFAULT_BRANCH", "main")
              if not ref_name or ref_name == default_branch:
                  return ""
              safe = ref_name.replace("/", "-")
              return f"/branches/{safe}"

          def instruction_report_line() -> str:
              base_url = os.environ.get("PAGES_BASE_URL", "").strip()
              outcome = os.environ.get("PAGES_DEPLOY_OUTCOME", "").strip()
              if base_url and outcome == "success":
                  return f"🔗 指令数详细报告: {base_url.rstrip('/')}{_branch_path()}/instruction-report/"
              return "🔗 指令数详细报告: GitHub Pages 暂不可用，请查看 CI artifact `perf-report` 中的 `public/instruction-report/index.html`"

          def perf_report_line() -> str:
              base_url = os.environ.get("PAGES_BASE_URL", "").strip()
              outcome = os.environ.get("PAGES_DEPLOY_OUTCOME", "").strip()
              if base_url and outcome == "success":
                  return f"🔗 性能详细报告: {base_url.rstrip('/')}{_branch_path()}/perf-report/"
              return "🔗 性能详细报告: GitHub Pages 暂不可用，请查看 CI artifact `perf-report` 中的 `public/perf-report/index.html`"

          def history_report_line() -> str:
              base_url = os.environ.get("PAGES_BASE_URL", "").strip()
              outcome = os.environ.get("PAGES_DEPLOY_OUTCOME", "").strip()
              if base_url and outcome == "success":
                  return f"🔗 历史报告索引: {base_url.rstrip('/')}/history.html"
              return "🔗 历史报告索引: GitHub Pages 暂不可用，请查看 CI artifact `perf-report` 中的 `public/history.html`"

          def fmt_optional_speedup(value) -> str:
              return f"{value:.2f}x" if isinstance(value, (int, float)) else "N/A"

          def int_or_none(value):
              return value if isinstance(value, int) else None

          def short_text(value: str, limit: int = 120) -> str:
              value = " ".join(value.split())
              if len(value) <= limit:
                  return value
              return value[: limit - 3].rstrip() + "..."

          def first_line(value: str) -> str:
              lines = value.splitlines()
              return lines[0] if lines else ""

          def format_commit_time(value: str) -> str:
              value = value.strip()
              if not value:
                  return "unknown"
              normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
              try:
                  dt = datetime.fromisoformat(normalized)
              except ValueError:
                  return short_text(value, 19)
              if dt.tzinfo is not None:
                  dt = dt.astimezone()
              return dt.strftime("%Y-%m-%d %H:%M:%S")

          def git_commit_time(ref: str) -> str:
              if not ref:
                  return ""
              try:
                  return subprocess.check_output(
                      ["git", "show", "-s", "--format=%cI", ref],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except Exception:
                  return ""

          def current_commit_time() -> str:
              timestamp = os.environ.get("HEAD_COMMIT_TIMESTAMP", "").strip()
              if not timestamp:
                  timestamp = git_commit_time("HEAD")
              return format_commit_time(timestamp)

          perf = read_json("build/perf-ci/perf-report.json")
          delta = read_json("build/perf-ci/perf-delta.json")
          insn_delta = read_json("build/perf-ci/instruction-count-compare.json")
          if not insn_delta and isinstance(delta.get("instruction_count"), dict):
              insn_delta = delta.get("instruction_count")
          rows = perf.get("rows", []) if isinstance(perf.get("rows"), list) else []
          delta_rows = delta.get("rows", []) if isinstance(delta.get("rows"), list) else []

          gcc_total = 0.0
          clang_total = 0.0
          compiler_total = 0.0
          total_counts = {"gcc": 0, "clang": 0, "compiler": 0}
          for row in rows:
              gcc = parse_seconds(row.get("gcc"))
              clang = parse_seconds(row.get("clang"))
              compiler = parse_seconds(row.get("compiler", row.get("yoolang")))
              if gcc is not None:
                  gcc_total += gcc
                  total_counts["gcc"] += 1
              if clang is not None:
                  clang_total += clang
                  total_counts["clang"] += 1
              if compiler is not None:
                  compiler_total += compiler
                  total_counts["compiler"] += 1

          gcc_total_value = gcc_total if total_counts["gcc"] else None
          clang_total_value = clang_total if total_counts["clang"] else None
          compiler_total_value = compiler_total if total_counts["compiler"] else None

          fast = 0
          slow = 0
          stable = 0
          delta_fast = int_or_none(delta.get("case_wins"))
          delta_slow = int_or_none(delta.get("case_losses"))
          delta_stable = int_or_none(delta.get("case_ties"))
          significant_ratio = 5.0
          significant_abs_sec = 0.01
          fast_cases = []
          slow_cases = []
          for row in delta_rows:
              delta_sec = row.get("delta_sec")
              delta_pct = row.get("delta_pct")
              if not isinstance(delta_sec, (int, float)) or not isinstance(delta_pct, (int, float)):
                  continue
              if abs(delta_pct) >= significant_ratio and abs(delta_sec) >= significant_abs_sec:
                  if delta_sec < 0:
                      fast += 1
                      fast_cases.append(row)
                  else:
                      slow += 1
                      slow_cases.append(row)
              else:
                  stable += 1
          if delta_fast is not None and delta_slow is not None and delta_stable is not None:
              fast = delta_fast
              slow = delta_slow
              stable = delta_stable
          fast_cases.sort(key=lambda item: (item.get("delta_pct", 0), item.get("delta_sec", 0)))
          slow_cases.sort(key=lambda item: (item.get("delta_pct", 0), item.get("delta_sec", 0)), reverse=True)

          functional = os.environ.get("FUNCTIONAL_OUTCOME", "unknown")
          perf_outcome = os.environ.get("PERF_OUTCOME", "unknown")
          status = "PASS" if functional == "success" and perf_outcome == "success" else "FAIL"
          status_emoji = "✅" if status == "PASS" else "❌"
          sha = os.environ.get("SHA", "")
          commit_title = short_text(first_line(os.environ.get("HEAD_COMMIT_MESSAGE", "")))

          baseline_branch = delta.get("baseline_branch") or delta.get("baseline") or "unknown"
          baseline_sha = str(delta.get("baseline_commit_sha") or "")
          baseline_timestamp = str(delta.get("baseline_commit_time") or "").strip()
          if not baseline_timestamp:
              baseline_timestamp = git_commit_time(baseline_sha)
          baseline_time = format_commit_time(baseline_timestamp)
          baseline_title = short_text(str(delta.get("baseline_commit_title") or ""))
          baseline_commit = f"{baseline_branch} @ {baseline_sha[:7] or 'unknown'} 🕒 {baseline_time}"
          if baseline_title:
              baseline_commit += f" {baseline_title}"
          current_yoolang_runtime_total = delta.get("current_compiler_total")
          baseline_yoolang_runtime_total = delta.get("baseline_compiler_total")

          lines = [
              f"{status_emoji} 🚀 提交者：{os.environ.get('ACTOR', 'unknown')}",
              "",
              f"🌿 branch: {os.environ.get('REF_NAME', 'unknown')}",
              f"🔖 commit: {sha[:7] or 'unknown'} 🕒 {current_commit_time()}",
              f"📄 {commit_title}",
              "",
              f"🧪 功能测试: {fmt_status(functional)}",
              f"📊 性能测试: {fmt_status(perf_outcome)}",
              perf_report_line(),
              "",
              "📈 基线对比:",
              f"⏱️ 当前 Yoolang 运行总耗时: {fmt_seconds(current_yoolang_runtime_total if isinstance(current_yoolang_runtime_total, (int, float)) else None)}",
              f"⏱️ 基线 Yoolang 运行总耗时: {fmt_seconds(baseline_yoolang_runtime_total if isinstance(baseline_yoolang_runtime_total, (int, float)) else None)}",
              f"整体: {fmt_overall(delta.get('total_delta_pct'))}, 总时间加速比 {fmt_baseline_speedup(delta)}",
              "",
              f"📍 基线: {baseline_commit}",
              f"⏱️ case 胜负: 🚀 {fast} 胜 / ⚠️ {slow} 负 / ✅ {stable} 平 / ❌ {perf.get('failures', 0)} 失败",
              "",
              "⚡ 目标程序运行速度:",
              f"yoolang {fmt_seconds(compiler_total_value)} / GCC {fmt_seconds(gcc_total_value)} / Clang++ {fmt_seconds(clang_total_value)}",
              f"📐 总时间加速比: GCC {fmt_speedup(gcc_total_value, compiler_total_value)} / Clang++ {fmt_speedup(clang_total_value, compiler_total_value)}",
              f"🧮 几何平均加速比: GCC {fmt_optional_speedup(perf.get('gcc_o3_geomean'))} / Clang++ {fmt_optional_speedup(perf.get('clang_o3_geomean'))}",
              f"🏁 单 case 更快: GCC {perf.get('gcc_o3_faster_cases', 'N/A')}个 / Clang++ {perf.get('clang_o3_faster_cases', 'N/A')}个",
          ]

          if insn_delta.get("status") == "OK":
              lines.extend(
                  [
                      "",
                      "🧮 QEMU 动态指令数:",
                      f"当前: {fmt_insn(insn_delta.get('current_total_instructions'))}",
                      f"基线: {fmt_insn(insn_delta.get('baseline_total_instructions'))}",
                      f"整体: {fmt_insn_overall(insn_delta)}, 指令数加速比 {fmt_insn_speedup(insn_delta)}",
                      instruction_report_line(),
                      (
                          "case 胜负: "
                          f"🚀 {insn_delta.get('case_wins', 0)} 胜 / "
                          f"⚠️ {insn_delta.get('case_losses', 0)} 负 / "
                          f"✅ {insn_delta.get('case_ties', 0)} 平 / "
                          f"❌ {insn_delta.get('case_failed', 0)} 失败"
                      ),
                  ]
              )
          else:
              insn_summary = perf.get("instruction_count_summary", {}) if isinstance(perf.get("instruction_count_summary"), dict) else {}
              reason = insn_delta.get("reason") or insn_summary.get("reason") or "instruction count data unavailable"
              status_text = insn_delta.get("status") or insn_summary.get("status") or "SKIPPED"
              lines.extend(
                  [
                      "",
                      f"🧮 QEMU 动态指令数: ⚠️ {status_text}",
                      f"原因: {reason}",
                      instruction_report_line(),
                  ]
              )

          if slow_cases:
              lines.extend(["", "⚠️ 最慢变化:"])
              for row in slow_cases[:2]:
                  case = str(row.get("case", "unknown")).rsplit("/", 1)[-1]
                  lines.append(f"{case} ⚠️ 慢 {float(row.get('delta_pct', 0)):.1f}%")

          if fast_cases:
              lines.extend(["", "🚀 最快变化:"])
              for row in fast_cases[:2]:
                  case = str(row.get("case", "unknown")).rsplit("/", 1)[-1]
                  lines.append(f"{case} 🚀 快 {abs(float(row.get('delta_pct', 0))):.1f}%")

          history_line = history_report_line()
          message = "\n".join([*lines, "", history_line])
          if len(message) > 1900:
              suffix = f"\n... <truncated>\n{history_line}"
              message = "\n".join(lines)[: 1900 - len(suffix)].rstrip() + suffix

          payload = {"content": message}
          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "yoolang-ci",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(resp.read().decode("utf-8", errors="replace"))
          except (TimeoutError, urllib.error.URLError) as exc:
              print(f"Discord notification failed: {exc}")
          except Exception as exc:
              print(f"Discord notification failed unexpectedly: {exc!r}")
          PY
