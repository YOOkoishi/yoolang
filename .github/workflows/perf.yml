name: Build and Perf

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-and-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          chmod +x scripts/setup_env.sh
          scripts/setup_env.sh

      - name: Ensure xmake in PATH
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already available: $(xmake --version | head -n 1)"
            exit 0
          fi
          if [ -f "$HOME/.local/bin/xmake" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/xmake" --version
            exit 0
          fi
          echo "xmake not found after setup_env.sh"
          exit 1

      - name: Build (xmake release)
        run: |
          xmake f -m release
          xmake -vD

      - name: Run perf script
        env:
          PERF_TEST_DIRS: test/bsb-final,test/bsb-perl
          PERF_MAX_CASES: "120"
          PERF_TIMEOUT_SEC: "20"
        run: |
          python3 scripts/compare_perf.py

      - name: Publish perf summary
        if: always()
        run: |
          if [ -f build/perf-ci/perf-report.md ]; then
            cat build/perf-ci/perf-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# RISC-V QEMU Perf Report" >> "$GITHUB_STEP_SUMMARY"
            echo "perf-report.md not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            build/perf-ci/perf-report.md
            build/perf-ci/perf-report.json
          if-no-files-found: warn
